<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      The Ultimate Developer Profile & Tech Summit Registration Form.
    </title>
  </head>
  <body>
    <header>
      <h1>The Ultimate Developer Profile & Tech Summit Registration Form.</h1>
    </header>
    <main>
      <form>
        <fieldset class="personal-info">
          <legend>Personal Information</legend>

          <label for="firstName">First Name</label>
          <input
            type="text"
            name="firstName"
            id="firstName"
            placeholder="eg. John"
          /><br />
          <label for="lastName">Last Name</label>
          <input
            type="text"
            name="lastName"
            id="lastName"
            placeholder="eg. Sharma"
          /><br />
          <label for="email">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="eg. john.sharma@example.com"
          /><br />
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            name="phone"
            id="phone"
            placeholder="eg. +1 (555) 123-4567"
          /><br />
          <label for="dateOfBirth">Date of Birth</label>
          <input type="date" name="dateOfBirth" id="dateOfBirth" /><br />
        </fieldset>
        <fieldset class="account-setting">
          <legend>Account Settings</legend>

          <label for="username">Username</label>
          <input
            type="text"
            name="username"
            id="username"
            placeholder="eg. johnsharma123"
          /><br />
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter your password"
          /><br />
        </fieldset>
        <fieldset class="preference">
          <legend>Preferences</legend>

          <label for="">Select System</label>
          <input type="radio" name="system" id="windows" value="Windows" />
          Windows <input type="radio" name="system" id="mac" value="Mac" /> Mac
          <input type="radio" name="system" id="linux" value="Linux" />
          Linux<br />
          <label for="language">Preferred Programming Language</label>
          <input type="checkbox" name="language" id="html" value="HTML" />
          <label for="html">HTML</label>
          <input type="checkbox" name="language" id="css" value="CSS" />
          <label for="css">CSS</label>
          <input type="checkbox" name="language" id="js" value="JavaScript" />
          <label for="js">JavaScript</label>
          <input type="checkbox" name="language" id="python" value="Python" />
          <label for="python">Python</label>
        </fieldset>
        <fieldset class="level-settings">
          <legend>Experience and Skill Level</legend>

          <label for="experience">Years of Experience</label>
          <input
            type="number"
            name="experience"
            id="experience"
            min="0"
            max="20"
            placeholder="eg. 5"
          />
          <br />
          <label for="skillLevel">Skill Level</label>
          <select name="skillLevel" id="skillLevel">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <br />
        </fieldset>
        <fieldset>
          <legend>Files & Bio</legend>

          <label for="resume">Upload Resume / Picture:</label>
          <input type="file" name="resume" id="resume" /><br /><br />

          <label for="bio">Professional Bio:</label><br />
          <textarea
            name="bio"
            id="bio"
            rows="4"
            cols="40"
            placeholder="Tell us about yourself..."
          ></textarea>
        </fieldset>
        <fieldset class="submit-fieldset">
          <button type="submit">Submit</button>
          <button type="reset">Reset</button>
        </fieldset>
      </form>
    </main>
  </body>
</html>
