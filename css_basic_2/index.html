<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css Basic 2</title>
    <style>
      .box-1 {
        color: red;
        background-color: #23a608;
        height: 200px;
        width: 300px;
      }
      .box-2 {
        color: rgb(80 60 100);
        background-color: #2b90f5;
        height: 200px;
        width: 300px;
      }
      .box-3 {
        color: #23a608;
        background-color: #f52b54;
        height: 200px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <div class="box-1"><h1>Box 1</h1></div>
    <div class="box-2"><h1>Box 2</h1></div>
    <div class="box-3"><h1>Box 3</h1></div>
  </body>
</html>
